    <div id="omni-container">
        <h4>Omni Utilities</h4>
        <ol class="list">
            <li class="fadein list-item input-item">
                <label for="omni-order">Order</label>
                <input id="omni-order" type="text" class="param-input input fadein transparent"
                    data-url="https://omni.plumbworldnetwork.co.uk/Order/Detail?internalOrderNumber=" value="J553739">
            </li>
            <li class="fadein list-item input-item">
                <label for="omni-part">Part</label>
                <input id="omni-part" type="text" class="param-input input fadein transparent"
                    data-url="https://omni.plumbworldnetwork.co.uk/Product/DetailsByPartNumber?partNumber="
                    value="PN7736902179B">
            </li>
        </ol>
    </div>

<style>
    .fadein {
        transition: background-color 0.5s;
    }

    .fadein:hover {
        background-color: var(--box-shadow-color);
    }

    .list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        font-size: 1em;
    }

    @media (min-width: 1200px) {
        .list {
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        }
    }

    .list-item {
        list-style-position: inside;
        padding: 0.25em;
    }

    .input-item {
        grid-column: span 2;
        display: flex;
        gap: 1rem;
    }

    input {
        width: 100%;
    }

    .container {
        max-width: 860px;
        margin: 0 auto;
    }
</style>

<script defer>
    (() => {
        const DELAY_MS = 500;
        const ALLOWED_IP = "31.24.7.85";

        let buffer = '';
        let timer = null;

        const flush = () => {
            const n = parseInt(buffer, 10);
            buffer = '';
            timer = null;
            if (n >= 1) {
                const item = document.querySelector(`.list li:nth-child(${n}) a`);
                if (item) item.click();
            }
        };

        document.addEventListener('keydown', (e) => {
            const digit = e.code.startsWith('Digit') || e.code.startsWith('Numpad')
                ? e.key
                : null;

            if (!/^[1-9]$/.test(digit) && !(digit === '0' && buffer.length > 0)) return;

            buffer += digit;
            clearTimeout(timer);
            timer = setTimeout(flush, DELAY_MS);

            if (buffer.length === 2) flush();
        });

        document.querySelectorAll(".param-input").forEach(input => {
            input.addEventListener("keydown", e => {
                if (e.key !== "Enter") return;

                const value = e.target.value.trim();
                if (!value) return;
                const url = e.target.dataset.url + encodeURIComponent(value);
                window.location.href = url;
            });
        });

        fetch("https://bell-soft.co.uk/whoami")
            .then(r => r.text())
            .then(ip => {
                document.getElementById("ip-addr").innerText = ip;
                if (ip.trim() !== ALLOWED_IP) {
                    document.getElementById("omni-container").style.display = "";
                }
            })
            .catch((e) => { console.error(e) });
    })();
</script>
