<style>
    :root {
        --fs-search: 1.75rem;
        --fs-primary: 1.15rem;
        --fs-body: 1rem;
        --fs-small: 0.8rem;
        --line: 1.5;
    }

    .greeting {
        font-size: var(--fs-small);
        font-weight: 400;
        opacity: 0.7;
    }

    .search-input {
        font-size: var(--fs-search);
        width: 100%;
        padding: 0.4em 0.5em;
        line-height: var(--line);
    }

    .section {
        margin-top: 1.5rem;
    }

    .list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem 1rem;
        line-height: var(--line);
        list-style: none;
    }

    @media (min-width: 1200px) {
        .list-primary {
            grid-template-columns: repeat(5, 1fr);
        }

        .list-secondary {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    .list-primary {
        font-size: var(--fs-primary);
    }

    .list-secondary {
        font-size: var(--fs-body);
        opacity: 0.75;
    }

    .list-item .hotkey {
        font-size: var(--fs-small);
        opacity: 0.5;
        margin-right: 0.4em;
        font-variant-numeric: tabular-nums;
    }

    .input-item {
        grid-column: span 2;
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .input-item input {
        width: 100%;
    }
</style>

<script defer>
    (() => {
        const DELAY_MS = 500;
        const ALLOWED_IP = "31.24.7.85";

        let buffer = '';
        let timer = null;

        const flush = () => {
            const n = parseInt(buffer, 10);
            buffer = '';
            timer = null;
            if (n >= 1) {
                const item = dom(`a[data-hotkey="${n}"]`);
                if (item) item.click();
            }
        };

        dom().addEventListener('keydown', (e) => {
            const digit = e.code.startsWith('Digit') || e.code.startsWith('Numpad')
                ? e.key
                : null;

            if (!/^[1-9]$/.test(digit) && !(digit === '0' && buffer.length > 0)) return;

            buffer += digit;
            clearTimeout(timer);
            timer = setTimeout(flush, DELAY_MS);

            if (buffer.length === 2) flush();
        });

        doms(".param-input").forEach(input => {
            input.addEventListener("keydown", e => {
                if (e.key !== "Enter") return;

                const value = e.target.value.trim();
                if (!value) return;
                const url = e.target.dataset.url + encodeURIComponent(value);
                window.location.href = url;
            });
        });

        fetch("https://bell-soft.co.uk/whoami")
            .then(r => r.text())
            .then(ip => {
                document.getElementById("ip-addr").innerText = ip;
            })
            .catch((e) => { console.error(e) });

        fetch("https://omni.plumbworldnetwork.co.uk/", { mode: "no-cors" })
            .then(() => {
                // reachable
                dom("omni-container").classList.remove("hidden");
                dom("omni-connect-msg").classList.add("hidden");
            })
            .catch(() => {
                dom("omni-connect-msg").innerText = "OMNI unreachable";
            });

        window.addEventListener("load", dom('search-input').focus());
    })();
</script>
